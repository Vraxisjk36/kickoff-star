name: Build Kickoff Star V4.1 Signed AAB

on:
  push:
    branches: [v4.1-release]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout V4.1
        uses: actions/checkout@v4

      - name: Verify V4.1 release configuration
        run: |
          grep -q 'versionCode 8' android/app/build.gradle
          grep -q 'versionName "4.1.0"' android/app/build.gradle
          grep -q 'ca-app-pub-3940256099942544/5224354917' src/engine/ads.ts
          grep -q 'const IS_TESTING = true' src/engine/ads.ts
          grep -q 'ca-app-pub-3940256099942544~3347511713' android/app/src/main/AndroidManifest.xml
          echo 'V4.1 version and test-ad configuration verified.'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm ci

      - name: Validate V4.1 rebuild
        run: |
          npm run build
          npm run audit:v4-v5
          npm run audit:v4-v5-routes
          npm run audit:v4-v5-competition
          npm run audit:v4-v5-master

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode release keystore
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'ERROR: signing keystore secret missing'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d --ignore-garbage > android/app/kickoff-star-release.keystore
          SIZE=$(stat -c%s android/app/kickoff-star-release.keystore)
          echo "Decoded keystore size: $SIZE bytes"
          test "$SIZE" -ge 500 || { echo 'ERROR: decoded keystore is suspiciously small'; exit 1; }

      - name: Build signed V4.1 release AAB
        working-directory: android
        env:
          KEYSTORE_PATH: kickoff-star-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload V4.1 signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: kickoff-star-v4.1-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
