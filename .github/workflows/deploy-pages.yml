name: Deploy Kickoff Star V4.1 to GitHub Pages

on:
  push:
    branches: [v4.1-release]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4.1 source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify V4.1 game
        run: |
          npm run lint
          npm run audit:v4
          npm run audit:v4-v5
          npm run audit:v4-v5-routes
          npm run audit:v4-v5-competition
          npm run audit:v4-v5-master
          npm run build

      - name: Prepare Pages fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/404.html

      - name: Publish V4.1 site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true
          enable_jekyll: false
