name: Kickoff Star V5.1 Signed Release AAB

on:
  workflow_dispatch:
  pull_request:
    branches: [v3.2-match-engine-redesign]
  push:
    branches: [codex/v32-v4-unified]

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Production checks
        run: |
          npx tsc --noEmit
          npm run build
      - name: Sync Android
        run: npx cap sync android
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kickoff-star-release.jks"
      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/kickoff-star-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Verify release identity and signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          grep -q 'applicationId "com.vraxis.kickoffstar"' android/app/build.gradle
          grep -q 'versionCode 11' android/app/build.gradle
          grep -q 'versionName "5.1.0"' android/app/build.gradle
          ! grep -q 'android:screenOrientation=' android/app/src/main/AndroidManifest.xml
          grep -q 'android:resizeableActivity="true"' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android:statusBarColor\|android:navigationBarColor' android/app/src/main/res/values/styles.xml
          jarsigner -verify -verbose -certs "$AAB" >/tmp/jarsigner.txt
          keytool -list -v -keystore "$RUNNER_TEMP/kickoff-star-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E 'SHA256:|Owner:|Valid from:' > /tmp/signing.txt
          sha256sum "$AAB" > /tmp/aab-sha256.txt
          cat /tmp/signing.txt
          cat /tmp/aab-sha256.txt
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: kickoff-star-v11-signed-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
