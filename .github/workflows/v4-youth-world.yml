name: V4 Youth World Validation
# Layers 1-7 integrated validation

on:
  push:
    branches: [main, v4-youth-world]
    paths:
      - 'src/types/youthWorld.ts'
      - 'src/engine/youthWorld.ts'
      - 'src/engine/youthPathways.ts'
      - 'src/engine/youthSchedule.ts'
      - 'src/engine/youthScoutingV4.ts'
      - 'src/engine/youthCompetitionsV4.ts'
      - 'src/engine/youthFinancesV4.ts'
      - 'src/engine/youthAcademyV4.ts'
      - 'src/engine/academyCareerV4.ts'
      - 'src/engine/regionalSelectionV4.ts'
      - 'src/engine/nationalPathwayV4.ts'
      - 'scripts/auditInternationalV5.ts'
      - 'src/components/navItems.ts'
      - 'src/screens/WeeklyHub.tsx'
      - 'src/screens/LoadCareerScreen.tsx'
      - 'src/screens/YearCalendar.tsx'
      - 'src/screens/MatchSummary.tsx'
      - 'src/screens/MatchScreen.tsx'
      - 'src/screens/MatchDayScreen.tsx'
      - 'src/components/GoalCelebration.tsx'
      - 'src/screens/tabs/HomeTab.tsx'
      - 'src/screens/tabs/ClubTab.tsx'
      - 'src/screens/tabs/LeagueTab.tsx'
      - 'src/screens/tabs/YouthLeagueTab.tsx'
      - 'src/App.tsx'
      - 'src/screens/tabs/WorldTab.tsx'
      - 'src/engine/international.ts'
      - 'src/engine/youthInternationalV5.ts'
      - 'src/engine/selectionEnergyV4.ts'
      - 'src/engine/venuesV4.ts'
      - 'src/engine/youthSaveV5.ts'
      - 'src/engine/careerEndV4.ts'
      - 'src/engine/academyNegotiationV4.ts'
      - 'src/engine/youthTransfersV4.ts'
      - 'src/engine/gazetteV4.ts'
      - 'src/engine/competitionStatsV4.ts'
      - 'src/engine/careerCalendarV4.ts'
      - 'src/engine/save.ts'
      - 'src/store/careerStore.ts'
      - 'scripts/auditYouthWorldV4.ts'
      - 'scripts/auditYouthLayers34V4.ts'
      - 'scripts/auditYouthLayers56V4.ts'
      - 'scripts/auditYouthAcademyV4.ts'
      - 'scripts/auditRepresentativeV4.ts'
      - 'scripts/auditV5RouteCalendar.ts'
      - 'scripts/auditV5ProductSurface.ts'
      - 'scripts/auditV5PlayerWorld.ts'
      - 'scripts/auditV5MasterScope.ts'
      - 'src/engine/youthFestivalV5.ts'
      - 'src/engine/grassrootsContractsV5.ts'
      - 'src/engine/schoolScholarshipsV5.ts'
      - 'scripts/auditYouthRemainingV5.ts'
      - 'scripts/simulateYouthCareersV5.ts'
      - '.github/workflows/v4-youth-world.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Youth world audit
        run: npx tsx scripts/auditYouthWorldV4.ts
      - name: Scheduling and scouting audit
        run: npx tsx scripts/auditYouthLayers34V4.ts
      - name: Competition and finance audit
        run: npx tsx scripts/auditYouthLayers56V4.ts
      - name: Academy trials and offers audit
        run: npx tsx scripts/auditYouthAcademyV4.ts
      - name: Representative pathway audit
        run: npx tsx scripts/auditRepresentativeV4.ts
      - name: International V5 audit
        run: npx tsx scripts/auditInternationalV5.ts
      - name: Remaining youth systems audit
        run: npx tsx scripts/auditYouthRemainingV5.ts
      - name: Full career simulation
        run: npx tsx scripts/simulateYouthCareersV5.ts
      - name: V5 route and calendar audit
        run: npx tsx scripts/auditV5RouteCalendar.ts

      - name: V5 whole-product surface audit
        run: npx tsx scripts/auditV5ProductSurface.ts

      - name: Behavioral player-world audit
        run: npx tsx scripts/auditV5PlayerWorld.ts

      - name: V5 master-scope reachability audit
        run: npx tsx scripts/auditV5MasterScope.ts

      - name: Production build
        run: npm run build
